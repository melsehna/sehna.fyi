<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitHub Activity Skyline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="3D GitHub contribution skyline — visualise any user's last 90 days of commits.">
  <style>
    @font-face {
      font-family: 'Cabin';
      src: url('/fonts/Cabin-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Cabin';
      src: url('/fonts/Cabin-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Cabin';
      src: url('/fonts/Cabin-SemiBold.ttf') format('truetype');
      font-weight: 600; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0b0b0b;
      --surface: #141414;
      --border:  #1e1e1e;
      --text:    #e2dfd9;
      --text-2:  #8a8a8a;
      --text-3:  #444;
      --accent:  #6fa86f;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cabin', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0 1.5rem;
      height: 52px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #toolbar h1 {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .home-link {
      font-size: 0.78rem;
      color: var(--text-3);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .home-link:hover { color: var(--text-2); border-bottom-color: var(--text-3); }

    .input-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }

    .input-prefix {
      font-size: 0.78rem;
      color: var(--text-3);
    }

    #username-input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      padding: 0.32rem 0.65rem;
      border-radius: 5px;
      width: 160px;
      outline: none;
      transition: border-color 0.15s;
    }
    #username-input:focus { border-color: var(--accent); }
    #username-input::placeholder { color: var(--text-3); }

    #view-btn {
      background: var(--accent);
      color: #0b0b0b;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.36rem 0.9rem;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.15s;
    }
    #view-btn:hover { background: #86c986; }

    /* ── Canvas wrap ── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }
    #canvas-wrap:active { cursor: grabbing; }

    #activity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Overlay ── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      background: var(--bg);
      transition: opacity 0.4s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay-msg {
      font-size: 0.82rem;
      color: var(--text-2);
    }

    /* ── Hint ── */
    #hint {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--text-3);
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    /* ── Period label ── */
    #period-label {
      position: absolute;
      top: 1rem;
      left: 1.25rem;
      font-size: 0.72rem;
      color: var(--text-3);
      pointer-events: none;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
<div id="app">

  <div id="toolbar">
    <h1>GitHub Activity Skyline</h1>
    <a href="/" class="home-link">sehna.fyi</a>
    <div class="input-group">
      <span class="input-prefix">github.com /</span>
      <input id="username-input" type="text" placeholder="username"
             autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button id="view-btn">View →</button>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="activity-canvas"></canvas>
    <div id="overlay">
      <div class="spinner"></div>
      <span id="overlay-msg">Loading contributions…</span>
    </div>
    <div id="period-label"></div>
    <div id="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
  </div>

</div>

<script>
// ── Params ────────────────────────────────────────────────────────────────────
const params   = new URLSearchParams(location.search);
const initUser = params.get('user') || 'melsehna';
const isEmbed  = params.get('embed') === '1';

if (isEmbed) {
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
}

// ── UI refs ───────────────────────────────────────────────────────────────────
const input       = document.getElementById('username-input');
const viewBtn     = document.getElementById('view-btn');
const overlay     = document.getElementById('overlay');
const overlayMsg  = document.getElementById('overlay-msg');
const periodLabel = document.getElementById('period-label');
const canvas      = document.getElementById('activity-canvas');
const ctx         = canvas.getContext('2d');
const wrap        = document.getElementById('canvas-wrap');

input.value = initUser;

// ── Colours ───────────────────────────────────────────────────────────────────
function commitColor(count) {
  if (count === 0) return [26,  26,  26 ];
  if (count <= 2)  return [30,  58,  30 ];
  if (count <= 5)  return [45,  90,  45 ];
  if (count <= 9)  return [74,  138, 74 ];
  return               [111, 168, 111];
}

function shade(rgb, delta) {
  return rgb.map(v => Math.max(0, Math.min(255, v + delta)));
}

function rgbStr(rgb) {
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

// ── Isometric projection ──────────────────────────────────────────────────────
// col/row in grid space (cols = weeks, rows = 0-6 = day of week)
// h = bar height in "scene units"
// Returns canvas pixel {x, y} relative to scene origin
const TW = 22; // tile width  (horizontal span of one cell)
const TH = 11; // tile height (vertical  span of one cell — TW/2 for 2:1 iso)

function proj(col, row, h, angle) {
  // rotate col/row around scene centre
  const cx = col;
  const rz = row;
  const rx = cx * Math.cos(angle) - rz * Math.sin(angle);
  const ry = cx * Math.sin(angle) + rz * Math.cos(angle);
  const sx = (rx - ry) * (TW / 2);
  const sy = (rx + ry) * (TH / 2) - h * TH;
  return { x: sx, y: sy };
}

// ── Scene state ───────────────────────────────────────────────────────────────
let days    = [];
let angle   = 0.52;   // radians — initial rotation
let zoom    = 1.0;
let offsetX = 0;
let offsetY = 0;
let raf     = null;

// auto-rotate
let autoRotate   = true;
const ROT_SPEED  = 0.003;

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawScene() {
  const W = canvas.width;
  const H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  if (!days.length) return;

  const cols    = Math.ceil(days.length / 7);
  const maxCount = Math.max(...days.map(d => d.count), 1);
  const MAX_H    = 28; // max bar height in scene units (scaled by TH each)

  // Collect bars
  const bars = [];
  days.forEach((day, i) => {
    const col = Math.floor(i / 7);
    const row = i % 7;
    const h   = day.count === 0 ? 0.15 : Math.max(0.35, (day.count / maxCount) * MAX_H);
    bars.push({ col, row, h, count: day.count });
  });

  // Painter's algorithm: sort by projected base-centre Y (ascending = furthest back)
  bars.sort((a, b) => {
    const pa = proj(a.col + 0.5, a.row + 0.5, 0, angle);
    const pb = proj(b.col + 0.5, b.row + 0.5, 0, angle);
    return pa.y - pb.y;
  });

  // Scene centre in grid coords (for camera target)
  const midCol = (cols - 1) / 2;
  const midRow = 3;

  // Origin: canvas centre + offsets
  const ox = W / 2 + offsetX;
  const oy = H / 2 + offsetY + 20;

  function toScreen(col, row, h) {
    const p = proj(col - midCol, row - midRow, h, angle);
    return { x: ox + p.x * zoom, y: oy + p.y * zoom };
  }

  const tw = (TW / 2) * zoom;
  const th = (TH / 2) * zoom;

  bars.forEach(({ col, row, h, count }) {
    const rgb  = commitColor(count);
    const htw  = h * TH * zoom;

    // 8 corners of the box
    // Base: N, E, S, W  (top of floor tile)
    // Top:  same but elevated by h
    const bN = toScreen(col,     row,     0);
    const bE = toScreen(col + 1, row,     0);
    const bS = toScreen(col + 1, row + 1, 0);
    const bW = toScreen(col,     row + 1, 0);

    const tN = toScreen(col,     row,     h);
    const tE = toScreen(col + 1, row,     h);
    const tS = toScreen(col + 1, row + 1, h);
    const tW = toScreen(col,     row + 1, h);

    // Determine which faces are visible based on angle
    // right face (east): col+1 side — always draw
    // left face (south): row+1 side — always draw
    // top face — always draw

    // Right face (east side)
    ctx.beginPath();
    ctx.moveTo(bE.x, bE.y);
    ctx.lineTo(bS.x, bS.y);
    ctx.lineTo(tS.x, tS.y);
    ctx.lineTo(tE.x, tE.y);
    ctx.closePath();
    ctx.fillStyle = rgbStr(shade(rgb, -30));
    ctx.fill();

    // Left face (south-west side)
    ctx.beginPath();
    ctx.moveTo(bW.x, bW.y);
    ctx.lineTo(bS.x, bS.y);
    ctx.lineTo(tS.x, tS.y);
    ctx.lineTo(tW.x, tW.y);
    ctx.closePath();
    ctx.fillStyle = rgbStr(shade(rgb, -55));
    ctx.fill();

    // Top face
    ctx.beginPath();
    ctx.moveTo(tN.x, tN.y);
    ctx.lineTo(tE.x, tE.y);
    ctx.lineTo(tS.x, tS.y);
    ctx.lineTo(tW.x, tW.y);
    ctx.closePath();
    ctx.fillStyle = rgbStr(shade(rgb, 30));
    ctx.fill();
  });
}

// ── Resize ────────────────────────────────────────────────────────────────────
function onResize() {
  canvas.width  = wrap.clientWidth  * devicePixelRatio;
  canvas.height = wrap.clientHeight * devicePixelRatio;
  canvas.style.width  = wrap.clientWidth  + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
  drawScene();
}
window.addEventListener('resize', onResize);

// ── Animation loop ────────────────────────────────────────────────────────────
function tick() {
  if (autoRotate) angle += ROT_SPEED;
  drawScene();
  raf = requestAnimationFrame(tick);
}

// ── Mouse / touch drag ────────────────────────────────────────────────────────
let dragging    = false;
let dragLastX   = 0;

wrap.addEventListener('pointerdown', e => {
  dragging  = true;
  dragLastX = e.clientX;
  autoRotate = false;
  wrap.setPointerCapture(e.pointerId);
});

wrap.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragLastX;
  angle   += dx * 0.008;
  dragLastX = e.clientX;
});

wrap.addEventListener('pointerup',    () => { dragging = false; });
wrap.addEventListener('pointercancel',() => { dragging = false; });

// ── Scroll to zoom ────────────────────────────────────────────────────────────
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.93 : 1.07;
  zoom = Math.max(0.3, Math.min(3.5, zoom));
}, { passive: false });

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchDays(username) {
  const commitsByDay = {};

  for (let page = 1; page <= 3; page++) {
    const res = await fetch(
      `https://api.github.com/users/${encodeURIComponent(username)}/events/public?per_page=100&page=${page}`,
      { headers: { Accept: 'application/vnd.github+json' } }
    );
    if (res.status === 404) throw new Error('User not found.');
    if (res.status === 403) throw new Error('GitHub rate limit hit — try again in a minute.');
    if (!res.ok) throw new Error(`GitHub API error (${res.status}).`);

    const events = await res.json();
    events.forEach(ev => {
      if (ev.type !== 'PushEvent') return;
      const date  = ev.created_at.slice(0, 10);
      const count = ev.payload.size ?? ev.payload.commits?.length ?? 0;
      commitsByDay[date] = (commitsByDay[date] || 0) + count;
    });

    if (events.length < 100) break;
  }

  const out = [];
  for (let i = 89; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().slice(0, 10);
    out.push({ date: dateStr, count: commitsByDay[dateStr] || 0 });
  }
  return out;
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function load(username) {
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  overlay.classList.remove('hidden');
  overlayMsg.textContent = `Loading @${username}…`;
  document.querySelector('.spinner').style.display = '';

  try {
    days = await fetchDays(username);

    const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    periodLabel.textContent = `@${username} · ${fmt(days[0].date)} – ${fmt(days[days.length - 1].date)}`;

    if (!isEmbed) {
      const url = new URL(location.href);
      url.searchParams.set('user', username);
      history.replaceState(null, '', url);
    }

    onResize();
    overlay.classList.add('hidden');

    if (!raf) tick();

  } catch (err) {
    document.querySelector('.spinner').style.display = 'none';
    overlayMsg.textContent = `Could not load @${username} — ${err.message}`;
  }
}

// ── UI events ─────────────────────────────────────────────────────────────────
viewBtn.addEventListener('click', () => { const u = input.value.trim(); if (u) load(u); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') { const u = input.value.trim(); if (u) load(u); } });

// ── Boot ──────────────────────────────────────────────────────────────────────
onResize();
load(initUser);
</script>
</body>
</html>
