<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitHub Activity Skyline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="3D GitHub contribution skyline — visualise any user's last 90 days of commits.">
  <style>
    @font-face {
      font-family: 'Cabin';
      src: url('/fonts/Cabin-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Cabin';
      src: url('/fonts/Cabin-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0b0b0b;
      --surface: #141414;
      --border:  #1e1e1e;
      --text:    #e2dfd9;
      --text-2:  #8a8a8a;
      --text-3:  #444;
      --accent:  #6fa86f;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cabin', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #app { display: flex; flex-direction: column; height: 100vh; }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 0 1.5rem;
      height: 52px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #toolbar h1 { font-size: 0.88rem; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }

    .home-link { font-size: 0.78rem; color: var(--text-3); text-decoration: none; border-bottom: 1px solid transparent; transition: color 0.15s, border-color 0.15s; }
    .home-link:hover { color: var(--text-2); border-bottom-color: var(--text-3); }

    .input-group { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
    .input-prefix { font-size: 0.78rem; color: var(--text-3); }

    #username-input {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-family: inherit; font-size: 0.82rem; padding: 0.32rem 0.65rem;
      border-radius: 5px; width: 160px; outline: none; transition: border-color 0.15s;
    }
    #username-input:focus { border-color: var(--accent); }
    #username-input::placeholder { color: var(--text-3); }

    #view-btn {
      background: var(--accent); color: #0b0b0b; border: none; font-family: inherit;
      font-weight: 700; font-size: 0.78rem; padding: 0.36rem 0.9rem;
      border-radius: 5px; cursor: pointer; letter-spacing: 0.02em; transition: background 0.15s;
    }
    #view-btn:hover { background: #86c986; }

    #canvas-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; }
    #canvas-wrap:active { cursor: grabbing; }
    #activity-canvas { width: 100%; height: 100%; display: block; }

    #overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.9rem;
      background: var(--bg); transition: opacity 0.4s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 28px; height: 28px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #overlay-msg { font-size: 0.82rem; color: var(--text-2); }

    #hint {
      position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; color: var(--text-3); pointer-events: none;
      white-space: nowrap; letter-spacing: 0.04em;
    }

    #period-label {
      position: absolute; top: 1rem; left: 1.25rem;
      font-size: 0.72rem; color: var(--text-3);
      pointer-events: none; letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>GitHub Activity Skyline</h1>
    <a href="/" class="home-link">sehna.fyi</a>
    <div class="input-group">
      <span class="input-prefix">github.com /</span>
      <input id="username-input" type="text" placeholder="username"
             autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button id="view-btn">View →</button>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="activity-canvas"></canvas>
    <div id="overlay">
      <div class="spinner"></div>
      <span id="overlay-msg">Loading contributions…</span>
    </div>
    <div id="period-label"></div>
    <div id="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
  </div>
</div>

<script>
const params   = new URLSearchParams(location.search);
const initUser = params.get('user') || 'melsehna';
const isEmbed  = params.get('embed') === '1';

if (isEmbed) {
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('hint').style.display    = 'none';
}

const input       = document.getElementById('username-input');
const viewBtn     = document.getElementById('view-btn');
const overlay     = document.getElementById('overlay');
const overlayMsg  = document.getElementById('overlay-msg');
const periodLabel = document.getElementById('period-label');
const canvas      = document.getElementById('activity-canvas');
const ctx         = canvas.getContext('2d');
const wrap        = document.getElementById('canvas-wrap');

input.value = initUser;

// ── Colours ───────────────────────────────────────────────────────────────────
function commitColor(count) {
  if (count === 0) return [26,  26,  26 ];
  if (count <= 2)  return [30,  58,  30 ];
  if (count <= 5)  return [45,  90,  45 ];
  if (count <= 9)  return [74,  138, 74 ];
  return               [111, 168, 111];
}

function shade(rgb, delta) {
  return rgb.map(v => Math.max(0, Math.min(255, v + delta)));
}

function rgbStr(rgb) { return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; }

// ── Projection ────────────────────────────────────────────────────────────────
const TW = 22;
const TH = 11;

function proj(col, row, h, angle) {
  const rx =  col * Math.cos(angle) - row * Math.sin(angle);
  const ry =  col * Math.sin(angle) + row * Math.cos(angle);
  return { x: (rx - ry) * (TW / 2), y: (rx + ry) * (TH / 2) - h * TH };
}

// ── State ─────────────────────────────────────────────────────────────────────
let days      = [];
let angle     = 0.52;
let zoom      = 1.0;
let offsetX   = 0;
let offsetY   = 0;
let raf       = null;
let autoRotate = true;

// hover
let mouseX = -9999, mouseY = -9999;
let hoveredBar = null;
const hoverScales = new Map(); // key = "col,row" → current scale (lerped)

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawScene() {
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.width  / dpr;
  const H   = canvas.height / dpr;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!days.length) return;

  const cols     = Math.ceil(days.length / 7);
  const maxCount = Math.max(...days.map(d => d.count), 1);
  const MAX_H    = 26;

  const midCol = (cols - 1) / 2;
  const midRow = 3;
  const ox = W / 2 + offsetX;
  const oy = H / 2 + offsetY + 20;

  function toScreen(col, row, h) {
    const p = proj(col - midCol, row - midRow, h, angle);
    return { x: ox + p.x * zoom, y: oy + p.y * zoom };
  }

  // Build bars
  const bars = days.map((day, i) => {
    const col = Math.floor(i / 7);
    const row = i % 7;
    const h   = day.count === 0 ? 0.15 : Math.max(0.35, (day.count / maxCount) * MAX_H);
    return { col, row, h, count: day.count, date: day.date };
  });

  // Painter's sort
  bars.sort((a, b) => {
    const pa = proj(a.col + 0.5 - midCol, a.row + 0.5 - midRow, 0, angle);
    const pb = proj(b.col + 0.5 - midCol, b.row + 0.5 - midRow, 0, angle);
    return pa.y - pb.y;
  });

  // Hit test — find bar closest to mouse
  let closestDist = Infinity;
  let newHovered  = null;
  bars.forEach(bar => {
    const p = toScreen(bar.col + 0.5, bar.row + 0.5, 0);
    const d = Math.hypot(p.x - mouseX, p.y - mouseY);
    if (d < closestDist) { closestDist = d; newHovered = bar; }
  });
  hoveredBar = closestDist < TW * zoom * 0.9 ? newHovered : null;

  // Animate hover scales
  bars.forEach(bar => {
    const key    = `${bar.col},${bar.row}`;
    const target = (hoveredBar && hoveredBar.col === bar.col && hoveredBar.row === bar.row) ? 1.55 : 1.0;
    const cur    = hoverScales.get(key) ?? 1.0;
    hoverScales.set(key, cur + (target - cur) * 0.18);
  });

  // Draw
  bars.forEach(bar => {
    const key   = `${bar.col},${bar.row}`;
    const scale = hoverScales.get(key) ?? 1.0;
    const drawH = bar.h * scale;
    const rgb   = commitColor(bar.count);
    const boost = (scale - 1.0) * 35; // extra brightness when hovered

    const bE = toScreen(bar.col + 1, bar.row,     0);
    const bS = toScreen(bar.col + 1, bar.row + 1, 0);
    const bW = toScreen(bar.col,     bar.row + 1, 0);

    const tN = toScreen(bar.col,     bar.row,     drawH);
    const tE = toScreen(bar.col + 1, bar.row,     drawH);
    const tS = toScreen(bar.col + 1, bar.row + 1, drawH);
    const tW = toScreen(bar.col,     bar.row + 1, drawH);

    // Right face
    ctx.beginPath();
    ctx.moveTo(bE.x, bE.y); ctx.lineTo(bS.x, bS.y);
    ctx.lineTo(tS.x, tS.y); ctx.lineTo(tE.x, tE.y);
    ctx.closePath();
    ctx.fillStyle = rgbStr(shade(rgb, -30 + boost));
    ctx.fill();

    // Left face
    ctx.beginPath();
    ctx.moveTo(bW.x, bW.y); ctx.lineTo(bS.x, bS.y);
    ctx.lineTo(tS.x, tS.y); ctx.lineTo(tW.x, tW.y);
    ctx.closePath();
    ctx.fillStyle = rgbStr(shade(rgb, -55 + boost));
    ctx.fill();

    // Top face
    ctx.beginPath();
    ctx.moveTo(tN.x, tN.y); ctx.lineTo(tE.x, tE.y);
    ctx.lineTo(tS.x, tS.y); ctx.lineTo(tW.x, tW.y);
    ctx.closePath();
    ctx.fillStyle = rgbStr(shade(rgb, 30 + boost));
    ctx.fill();
  });

  // Tooltip for hovered bar
  if (hoveredBar && hoveredBar.count > 0) {
    const scale  = hoverScales.get(`${hoveredBar.col},${hoveredBar.row}`) ?? 1.55;
    const tip    = toScreen(hoveredBar.col + 0.5, hoveredBar.row + 0.5, hoveredBar.h * scale + 0.5);
    const label  = `${hoveredBar.date}  ·  ${hoveredBar.count} commit${hoveredBar.count !== 1 ? 's' : ''}`;
    const pad    = 8;
    ctx.font     = `600 11px Cabin, system-ui, sans-serif`;
    const tw     = ctx.measureText(label).width;
    const bx     = tip.x - tw / 2 - pad;
    const by     = tip.y - 28;
    const bw     = tw + pad * 2;
    const bh     = 22;

    ctx.fillStyle = 'rgba(20,20,20,0.92)';
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 4);
    ctx.fill();

    ctx.fillStyle = '#e2dfd9';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + pad, by + bh / 2);
  }
}

// ── Resize ────────────────────────────────────────────────────────────────────
function onResize() {
  const dpr = window.devicePixelRatio || 1;
  const W   = wrap.clientWidth;
  const H   = wrap.clientHeight;
  canvas.width        = W * dpr;
  canvas.height       = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { onResize(); drawScene(); });

// ── Animation loop ────────────────────────────────────────────────────────────
function tick() {
  if (autoRotate) angle += 0.003;
  drawScene();
  raf = requestAnimationFrame(tick);
}

// ── Drag ─────────────────────────────────────────────────────────────────────
let dragging = false, dragLastX = 0;

wrap.addEventListener('pointerdown', e => {
  dragging   = true;
  dragLastX  = e.clientX;
  autoRotate = false;
  wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener('pointermove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  if (!dragging) return;
  angle    += (e.clientX - dragLastX) * 0.008;
  dragLastX = e.clientX;
});
wrap.addEventListener('pointerup',     () => { dragging = false; });
wrap.addEventListener('pointercancel', () => { dragging = false; });
wrap.addEventListener('mouseleave',    () => { mouseX = -9999; mouseY = -9999; });

// ── Zoom ──────────────────────────────────────────────────────────────────────
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.3, Math.min(3.5, zoom * (e.deltaY > 0 ? 0.93 : 1.07)));
}, { passive: false });

// ── Fetch (parallel pages, 8 s timeout) ──────────────────────────────────────
async function fetchWithTimeout(url, options, ms) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, { ...options, signal: ctrl.signal });
  } finally {
    clearTimeout(tid);
  }
}

async function fetchDays(username) {
  const opts = { headers: { Accept: 'application/vnd.github+json' } };
  const urls = [1, 2, 3].map(p =>
    `https://api.github.com/users/${encodeURIComponent(username)}/events/public?per_page=100&page=${p}`
  );

  // Fetch all 3 pages in parallel with 8 s timeout each
  const responses = await Promise.all(urls.map(u => fetchWithTimeout(u, opts, 8000)));

  const commitsByDay = {};
  for (const res of responses) {
    if (res.status === 404) throw new Error('User not found.');
    if (res.status === 403) throw new Error('Rate limited — try again in a minute.');
    if (!res.ok) continue; // skip bad pages silently
    const events = await res.json();
    events.forEach(ev => {
      if (ev.type !== 'PushEvent') return;
      const date  = ev.created_at.slice(0, 10);
      const count = ev.payload.size ?? ev.payload.commits?.length ?? 0;
      commitsByDay[date] = (commitsByDay[date] || 0) + count;
    });
  }

  const out = [];
  for (let i = 89; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().slice(0, 10);
    out.push({ date: dateStr, count: commitsByDay[dateStr] || 0 });
  }
  return out;
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function load(username) {
  overlay.style.opacity      = '1';
  overlay.style.pointerEvents = 'auto';
  overlay.classList.remove('hidden');
  overlayMsg.textContent = `Loading @${username}…`;
  document.querySelector('.spinner').style.display = '';

  try {
    days = await fetchDays(username);

    const fmt = s => new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    periodLabel.textContent = `@${username} · ${fmt(days[0].date)} – ${fmt(days[days.length - 1].date)}`;

    if (!isEmbed) {
      const url = new URL(location.href);
      url.searchParams.set('user', username);
      history.replaceState(null, '', url);
    }

    onResize();
    overlay.classList.add('hidden');
    if (!raf) tick();

  } catch (err) {
    document.querySelector('.spinner').style.display = 'none';
    overlayMsg.textContent = err.name === 'AbortError'
      ? `Timed out loading @${username} — check the username and try again.`
      : `Could not load @${username} — ${err.message}`;
  }
}

// ── Events ────────────────────────────────────────────────────────────────────
viewBtn.addEventListener('click', () => { const u = input.value.trim(); if (u) load(u); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') { const u = input.value.trim(); if (u) load(u); } });

// ── Boot ──────────────────────────────────────────────────────────────────────
onResize();
load(initUser);
</script>
</body>
</html>
